name: Update leasing prices

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch live prices and rebuild data.js
        run: python update_prices.py

      - name: Regenerate model pages from the updated data
        run: python build_model_pages.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "carforyou-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js modeller.html model-*.html model-index.json model-index.js
          if git diff --cached --quiet; then
            echo "No price changes today -- nothing to commit."
          else
            git commit -m "Automated price update $(date -u +%Y-%m-%d)"
            git push
          fi
